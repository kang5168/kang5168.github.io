<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>康宗海 - 个人主页</title>
  
  <!-- 这里引用独立的 CSS 文件 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 主卡片内容 -->
  <div class="card">
    <h1>康宗海</h1>
    <div class="subtitle">Python & Web 我在学习中</div>
    <div class="desc">正在学习 HTML、CSS 和 Web 后端开发，逐渐打造自己的网站。</div>
    
    <a href="mailto:442479072@qq.com" class="email-btn">442479072@qq.com</a>

    <div class="social-links">
      <button class="social-btn" onclick="openModal('qq-modal')">QQ 联系</button>
      <button class="social-btn" onclick="openModal('douyin-modal')">抖音 主页</button>
    </div>
  </div>

  <!-- QQ 弹窗 -->
  <div id="qq-modal" class="modal" onclick="closeModal('qq-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closeModal('qq-modal')">&times;</span>
      <h3 style="margin:0; font-size: 16px;">扫码添加 QQ</h3>
      <img src="qq-qrcode.png" alt="QQ二维码" class="qrcode-img">
      <p style="margin:0; font-size:13px; color:#6e6e73;">QQ 号：442479072</p>
    </div>
  </div>

  <!-- 抖音 弹窗 -->
  <div id="douyin-modal" class="modal" onclick="closeModal('douyin-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closeModal('douyin-modal')">&times;</span>
      <h3 style="margin:0; font-size: 16px;">扫码关注抖音</h3>
      <img src="douyin-qrcode.png" alt="抖音二维码" class="qrcode-img">
    </div>
  </div>

  <!-- JavaScript 控制显隐 -->
  <script>
    function openModal(modalId) {
      document.getElementById(modalId).style.display = 'flex';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }
  </script>

</body>
</html>
