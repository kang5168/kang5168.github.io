<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>个人主页</title>

  <!-- 1. CSS 代码放在 <style> 标签里面 -->
  <style>
    /* 这里放之前的 CSS 代码 */
    .social-links { ... }
    .social-btn { ... }
    .modal { ... }
    /* ...其余 CSS 样式... */
  </style>
</head>
<body>

  <!-- 2. HTML 代码放在 <body> 标签里面，卡片的下方 -->
  <div class="card">
    <h2>康宗海</h2>
    <p>Python & Web 我在学习中</p>
    <p>正在学习 HTML、CSS 和 Web 后端开发...</p>
    <button class="email-btn">442479072@qq.com</button>

    <!-- ★ 把新增的社交按钮和弹窗 HTML 贴在这里 ★ -->
    <div class="social-links">
      <button class="social-btn qq" onclick="openModal('qq-modal')">QQ 联系</button>
      <button class="social-btn douyin" onclick="openModal('douyin-modal')">抖音 主页</button>
    </div>

    <div id="qq-modal" class="modal" onclick="closeModal('qq-modal')">
      <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal('qq-modal')">&times;</span>
        <h3>扫码添加 QQ</h3>
        <img src="qq-qrcode.png" alt="QQ二维码" class="qrcode-img">
        <p>QQ 号：442479072</p>
      </div>
    </div>

    <div id="douyin-modal" class="modal" onclick="closeModal('douyin-modal')">
      <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal('douyin-modal')">&times;</span>
        <h3>扫码关注抖音</h3>
        <img src="douyin-qrcode.png" alt="抖音二维码" class="qrcode-img">
      </div>
    </div>
  </div>

  <!-- 3. JS 代码放在 </body> 之前的 <script> 标签里面 -->
  <script>
    function openModal(modalId) {
      document.getElementById(modalId).style.display = 'flex';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }
  </script>
</body>
</html>
